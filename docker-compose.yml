services:

  api:
    build: .
    ports:
      - "8000:8000"

    environment:
      APP_ENV: development
      APP_VERSION: local

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
