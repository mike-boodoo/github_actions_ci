[project]
name = "ci-cd-demo"
version = "1.0.0"
description = "Production-style CI/CD demonstration"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]

[tool.mypy]
python_version = "3.12"
strict = true
